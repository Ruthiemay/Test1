<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Contact Form</title>
    <link rel="stylesheet" type="text/css" href="style.css">
  </head>
  <body>
    <h1>Contact Form</h1>
    <form id="contact-form">
      <div>
        <label for="first-name">First Name:</label>
        <input type="text" id="first-name" name="first-name">
      </div>
      <div>
        <label for="last-name">Last Name:</label>
        <input type="text" id="last-name" name="last-name">
      </div>
      <div>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
      </div>
      <div>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
      </div>
      <div>
        <label for="confirm-password">Confirm Password:</label>
        <input type="password" id="confirm-password" name="confirm-password">
      </div>
      <div>
        <label for="select-box">Your Course:</label>
        <select id="select-box" name="select-box">
          <option value="">--Please choose your course--</option>
          <option value="option1">BSIT</option>
          <option value="option2">BSCS</option>
          <option value="option3">BSIS</option>
          <option value="option4">BLIS</option>
        </select>
      </div>
      <button type="submit">Submit</button>
    </form>
    <div id="status"></div>
    <script src="script.js"></script>
  </body>
</html>
